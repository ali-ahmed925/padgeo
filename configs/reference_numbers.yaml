# Published MAD-Sim numbers shown next to our tables (percent). Checked against the paper's HTML on 2026-10-11.
source: >-
  PADFormer: Pose-agnostic Anomaly Detection from Sparse View Images (Wang et al., ECCV 2026),
  arXiv:2608.04210v1, Table 1, MAD-SIM columns.
note: >-
  Single runs; the paper reports no seeds or standard deviations and does not state how many classes its
  means cover (MAD-Sim has 20) or how AUPRO is computed. PADFormer is trained on the full MAD-Sim training
  set and draws N random references per test image at inference; UniVAD is training-free.
