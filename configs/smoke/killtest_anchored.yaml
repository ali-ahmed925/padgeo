# Local smoke version of configs/killtest_anchored.yaml: the fake geometry backend instead of VGGT (its 3D
# points describe a synthetic sphere, not the object), DINOv2 ViT-S, 8 queries per class. Numbers are
# meaningless; this exercises the code path end to end.
experiment:
  name: smoke_killtest_anchored
  output_dir: outputs
  seeds: [0, 1, 2]
data:
  dataset: mad_sim
  root: data/MAD-Sim
  classes: [03Mallard, 04Turtle, 18Obesobeso]
  num_references: 4
  sampling: per_query
  max_queries_per_class: 8
features:
  backbone: dinov2_vits14
  precision: fp32
  device: cuda
  batch_size: 8
foreground:
  pixel_threshold: 0.98
  min_patch_fraction: 0.1
method:
  name: anchored_nn
  device: cuda
  geometry:
    backend: fake
    point_source: depth
    precision: fp32
    device: cpu
  neighbourhood: {mode: radius, radius: 0.05}
  unseen: fallback_global
  min_confidence: 1.5
aggregation:
  image_score: {mode: top_percent, percent: 1.0}
  pixel_sigma: 4.0
cache:
  dir: cache
