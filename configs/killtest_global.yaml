# Kill test, baseline: AnomalyDINO-style nearest neighbour among all reference patches (no geometry).
# Identical to killtest_anchored.yaml except for the `method` section and the experiment name
# (enforced by tests/test_config.py and by scripts/make_table.py). Run on the 24 GB machine.
experiment:
  name: killtest_global
  output_dir: outputs
  seeds: [0, 1, 2]
data:
  dataset: mad_sim
  root: data/MAD-Sim
  classes: [03Mallard, 04Turtle, 18Obesobeso]
  num_references: 4
  sampling: per_query
  max_queries_per_class: null
features:
  backbone: dinov2_vitl14
  precision: fp32
  device: cuda
  batch_size: 16
foreground:
  pixel_threshold: 0.98
  min_patch_fraction: 0.1
method:
  name: global_nn
  device: cuda
aggregation:
  image_score: {mode: top_percent, percent: 1.0}
  pixel_sigma: 4.0
cache:
  dir: cache
